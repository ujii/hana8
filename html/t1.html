<!DOCTYPE html> <!-- 파일의 타입 명시하는 코드-->
<html lang="en"> <!-- 기본 언어 설정. 큰 의미 x -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>first html</title>
    <!--
        <script>는 자바스크립트 작성할 수 있는 태그. 최근은 head 태그 안이 아니라 body 아래에 둔다.
        DOM 구조를 유지함에 따라 속도가 빨라지기 때문
    -->
    <!--
        <style> // rem
        body {
            font-size: 10px;
        }
        </style>
    -->
    <style>
        h1{
            font-size: 1.5rem;
        }

        h3 {
            font-size: 1.2rem;
        }

        main, article, aside {
            border: 1px solid red;
        }

        main section { 
            border: 1px dotted blue;
        }

        .container {
            background-color: yellow;
            width: 200px;
        }

        ul li:first-child {
            font-weight: 700;
        }

        ol li:nth-child(odd):not(.x) {
            font-weight: 700;
        }   
        

        </style>
</head>

<body>
    <!-- <div>style="font-size: .2rem;"</div> head 폰트 사이즈의 2배-->
    <header>
        <h1>Title</h1>
        <nav>Nav</nav>
    </header>
    <main style="display: flex; align-items: center; justify-content: center;">
    <div class="container">
        <section aria-label="section1" onclick="console.log('xxx')" aria-hidden="true">
            <h3>Section</h3>
            <ul> <!-- ul>li*3 -->
                <li>111</li>
                <li a href="#" onClick="" role="button">222</li>
                <li>333</li>
            </ul>
        </section>
        <article draggable="true">
            <h3>Article</h3> 
            <ol> <!-- ol>li{0$}*3 -->
                <li>1</li>
                <li>2</li>
                <li class="x">3</li>
                <li>4</li>
                <li>5</li>
                <li>6</li>
            </ol>   
        </article>
    </div>
        <!-- <aside style="text-align: center; width: 200px;">Aside</aside> -->
        <aside style="display: flex; justify-content: center; width: 100px; height: 200px; align-items: end;">Aside</aside>
    </main>
    <footer style="text-align: center;">&#169; Hanaro8 2025</footer>
</html>
