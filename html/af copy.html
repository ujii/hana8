<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Timer</title>
  </head>
  <body>
    <div id="timer">00:00:000</div>
    <button id="btn">START</button>
    <script>
      let start;
      let stop;
      let idle = 0;

      const $btn = document.getElementById('btn');
      const $timer = document.getElementById('timer');

      let isRunning = false;
      function rendering() {
        setTimeout(() => {
          const now = Date.now();
          $timer.innerHTML = formatTime(now - start - idle);
          // const now = new Date().getTime();
          const left = 10 - (now % 10);
          setTimeout(() => {
            rendering();
          }, left);
        });
      }

      $btn.addEventListener('click', function () {
        console.log(this.innerText);
        if (this.innerText === 'START') {
          this.innerText = 'STOP';
          isRunning = true;

          if (start === undefined) {
            start = Date.now();
          }
          idle += Date.now() - stop;
          rendering();
        } else {
          this.innerText = 'START';
          isRunning = false;
          stop = Date.now();
        }
      });

      function formatTime(milis) {
        const m = padNum(Math.trunc(milis / 60000), 2);
        const s = padNum(Math.trunc((milis % 60000) / 1000), 2);
        const ms = padNum(Math.trunc(milis % 1000), 3);
        return `${m}:${s}:${ms}`;
      }

      function padNum(time, n) {
        return time.toString().padStart(n, '0');
      }
    </script>
  </body>
</html>
